[package]
name = "lan_video"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Low-latency LAN video transport (GStreamer + RTP/UDP) with session management."

[features]
default = []
viewer = ["dep:gstreamer", "dep:gstreamer-app", "dep:sdl2", "dep:tungstenite"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "io-util",
    "rt-multi-thread",
    "net",
    "signal",
    "process",
    "sync",
    "time",
    "fs",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.24", optional = true }
gstreamer-app = { version = "0.24", optional = true }
sdl2 = { version = "0.37", optional = true }
tungstenite = { version = "0.29", features = ["url"], optional = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
