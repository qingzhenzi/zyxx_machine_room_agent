[package]
name = "qe-container"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
description = "Local container control plane (Docker or Incus) for containers, images, services, and networks."
keywords = ["docker", "incus", "container", "lxd", "orchestration"]
categories = ["api-bindings", "development-tools"]

[lib]
name = "qe_container"
path = "src/lib.rs"

[[bin]]
name = "qe-container"
path = "src/bin/qe-container.rs"
required-features = ["cli"]

[features]
default = ["config"]
config = ["dep:toml", "dep:dotenvy"]
cli = ["config", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
async-trait = "0.1"
bollard = "0.21.1"
bytes = "1"
fastrand = "2"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
humantime = "2"
humantime-serde = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = "0.9"
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

# Optional: declarative TOML service files.
dotenvy = { version = "0.15", optional = true }
toml = { version = "0.8", optional = true }

# Optional: standalone CLI.
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
