# cargo-deny 配置模板：只允许宽松许可证，防止将来间接引入 GPL/AGPL 依赖。
# 用法：cargo install cargo-deny --locked && cargo deny check licenses
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
