[package]
name = "qep2p"
version = "0.2.0"
edition = "2024"
description = "Intranet-first P2P file transfer over iroh: mDNS discovery, authenticated QUIC, self-hosted relay"

[[bin]]
name = "qep2p"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.103.1", features = ["fs-store"] }
iroh-mdns-address-lookup = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "sync",
    "signal",
    "fs",
] }
