[package]
name = "platform-diagnose"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Rule-based device fault diagnosis: correlates runtime signals into ranked root causes across app/system/host/network dimensions."
keywords = ["diagnostics", "root-cause", "monitoring", "health", "troubleshooting"]
categories = ["os", "development-tools::debugging"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Baseline point-in-time snapshot (identity, disks, SMART, firmware, ...).
platform-health = { path = "../platform-health", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
