[package]
name = "qe-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "QEStudio 统一机器 agent 客户端：device-pki mTLS 注册、镜像导入、机器遥测"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
qe-device-pki-client = { path = "../../crates/qe-device-pki-client" }
qe-node-agent = { path = "../../crates/qe-node-agent" }
qe-room-agent = { path = "../../crates/qe-room-agent" }
# 守护进程能力库（进程内直接使用）：安全核查 / 容器 / 虚拟化 / P2P 传输。
qeaudit = { path = "../../crates/qeaudit" }
qe-container = { path = "../../crates/qe-container" }
virt-crate = { path = "../../crates/virt-crate", features = ["libvirt-backend"] }
virt-core = { path = "../../crates/virt-crate/crates/virt-core" }
virt-libvirt = { path = "../../crates/virt-crate/crates/virt-libvirt" }
qep2p = { path = "../../crates/qep2p" }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"
