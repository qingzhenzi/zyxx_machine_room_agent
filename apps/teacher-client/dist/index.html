<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e11" />
    <title>QEStudio Agent</title>
    <script>
      // Apply the persisted theme before first paint to avoid a white flash.
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('qestudio.settings') || '{}')
          var theme = saved.theme || 'dark'
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme =
            theme === 'system' ? (dark ? 'dark' : 'light') : theme
          document.documentElement.dataset.density = saved.density || 'compact'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.density = 'compact'
        }
      })()
    </script>
    <style>html,body{background:#0c0e11;height:100%;margin:0}html[data-theme=light],html[data-theme=light] body{background:#ecebe6}</style>

    <link rel="stylesheet" crossorigin href="/assets/index-w6SBtSIQ.css">
  </head>

</html>
