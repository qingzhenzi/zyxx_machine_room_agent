[workspace]
resolver = "3"
members = [
    "apps/qe-agent",
    "crates/qe-nftables",
    "crates/platform-health",
    "crates/platform-diagnose",
    "crates/lan_video",
    "crates/qe-agent-node",
    "crates/qe-agent-telemetry",
    "crates/qe-device-pki-client",
    "crates/qe-container",
    "crates/virt-crate",
    "crates/virt-crate/crates/virt-core",
    "crates/virt-crate/crates/virt-kvm",
    "crates/virt-crate/crates/virt-libvirt",
    "crates/qeaudit",
    "crates/qep2p",
]
# Tauri 应用是独立工程（自有前端工具链与发布流程），不并入本 workspace
exclude = ["apps/agent-client", "apps/boot-display", "apps/teacher-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/QEStudio/backend-template"
authors = ["QEStudio"]

[workspace.dependencies]
# virt-crate 系列共用（原 virt-crate 内部 workspace 下沉至此）
thiserror = "2"
kvm-ioctls = "0.25"
kvm-bindings = "0.14"
virt = "0.4"
virt-core = { path = "crates/virt-crate/crates/virt-core" }
virt-kvm = { path = "crates/virt-crate/crates/virt-kvm" }
virt-libvirt = { path = "crates/virt-crate/crates/virt-libvirt" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

# qeaudit 原是 opt-level="z" 的独立工程，按包覆盖保留其体积优化。
# 注意不要给它设 panic="abort"：main 里用 catch_unwind 隔离单个检查器的崩溃。
[profile.release.package.qeaudit]
opt-level = "z"

# 磁盘优化（2026-11-07）：target 曾达 47G。dev/test 只保留行表级调试信息并关闭
# 增量编译，避免 target/debug/incremental 无界增长；完整调试用
# `CARGO_PROFILE_DEV_DEBUG=2 cargo ...`。
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
